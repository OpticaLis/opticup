# Lighthouse — daily Tier 1 sweep (REC-SITE-013 / M3_LIGHTHOUSE_NIGHTLY_CRON).
#
# Runs at 03:00 IDT (00:00 UTC) every day on develop branch.
# - Headless Chromium (preinstalled on ubuntu-latest)
# - Lighthouse + axe-core (via Lighthouse a11y category)
# - 30 URLs (10 Tier 1 routes × 3 langs)
# - Per-URL JSON + SUMMARY.md → docs/guardian/lighthouse-reports/daily/{date}/
# - Regressions append to docs/guardian/GUARDIAN_ALERTS.md (ALL_CLEAR if none)
# - Auto-commits the reports as `OpticaLis [bot]` and pushes to develop
# - Always exits 0; the alert IS the signal

name: lighthouse-daily

on:
  schedule:
    # 03:00 IDT (Israel) = 00:00 UTC. Daily.
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Optional note for the manual run (kept in run logs only)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: lighthouse-daily
  cancel-in-progress: false

jobs:
  run-tier1:
    name: Lighthouse Tier 1 (30 URLs)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          # Need history so the auto-commit step can push without rejection
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache lighthouse-tools node_modules
        uses: actions/cache@v4
        with:
          path: roles/site-overseer/tools/lighthouse/node_modules
          key: lighthouse-${{ runner.os }}-${{ hashFiles('roles/site-overseer/tools/lighthouse/package-lock.json') }}
          restore-keys: |
            lighthouse-${{ runner.os }}-

      - name: Install Lighthouse dependencies
        working-directory: roles/site-overseer/tools/lighthouse
        run: npm ci --no-fund --no-audit

      - name: Run Lighthouse Tier 1 sweep
        working-directory: roles/site-overseer/tools/lighthouse
        run: npm run tier1

      - name: Commit + push reports
        run: |
          git config user.name "OpticaLis [bot]"
          git config user.email "noreply@opticalis.co.il"
          git add docs/guardian/lighthouse-reports/ docs/guardian/GUARDIAN_ALERTS.md
          if git diff --staged --quiet; then
            echo "No report changes to commit (sweep may have failed before writing)."
            exit 0
          fi
          git commit -m "chore(guardian): lighthouse daily report $(date -u +%Y-%m-%d)"
          git push origin develop
