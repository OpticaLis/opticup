<!-- lens-pos-list-partial.html — M1_LENS_ACTIVE_POS_LIST_REBUILD 2026-05-18
     1:1 mockup-fidelity rebuild per architecture-brief/mockups/
     LENS_ACTIVE_POS_LIST_MOCKUP.html. Mount points only — visual rendering
     happens in JS through Phase 0 shared components (StatCardRow,
     ChipFilterRow, SideDetailPanel) + a TableBuilder-driven table.
     Page-frame CSS in css/lens-pos-list-page.css scoped to
     .lens-tab-section[data-tab="pos-list"]. -->

<div id="access-gate" style="display:none">
  <div class="empty-state">אין הרשאה למסך זה (lens.po.view).</div>
</div>

<div id="app" class="lens-pos-list-page" style="display:none">

  <!-- ───── Page header ───── -->
  <div class="lens-pos-header">
    <div class="lens-pos-title">
      📋 הזמנות פתוחות — עדשות
      <span class="badge" id="pos-count-badge">טוען...</span>
    </div>
    <div class="lens-pos-actions">
      <button class="btn btn-g" id="btn-refresh" type="button">🔄 רענן</button>
      <button class="btn btn-p btn-primary" type="button" onclick="InvShellLens.setActive('purchase-order')">➕ הזמנה חדשה</button>
    </div>
  </div>

  <!-- ───── 5 Stat cards (StatCardRow mount) ───── -->
  <div id="lens-pos-stats-mount"></div>

  <!-- ───── Source-type chip filter row (ChipFilterRow mount) ───── -->
  <div id="lens-pos-chip-filters-mount"></div>

  <!-- ───── Secondary filter bar (supplier + search + clear) ───── -->
  <div class="lens-pos-filter-bar">
    <span class="filter-label">סינון:</span>
    <select id="filter-supplier"><option value="">🏢 ספק: הכל</option></select>
    <select id="filter-include-cancelled">
      <option value="exclude">📦 ביטולים: הסתר</option>
      <option value="include">📦 ביטולים: הצג</option>
      <option value="only">📦 ביטולים בלבד</option>
    </select>
    <input type="text" id="filter-search" placeholder="🔍 חיפוש: PO# / ספק" />
    <button class="btn btn-g btn-sm" id="btn-clear-filters" type="button">⟲ נקה סינון</button>
  </div>

  <!-- ───── Main table panel ───── -->
  <div class="lens-pos-panel">
    <div class="lens-pos-panel-header">
      <h3>הזמנות פתוחות</h3>
      <span class="results-count" id="results-count">—</span>
    </div>
    <div id="table-container">
      <div class="empty-state">טוען הזמנות...</div>
    </div>
    <div class="lens-pos-footer" id="lens-pos-footer" style="display:none">
      <div id="lens-pos-footer-totals"></div>
      <div id="lens-pos-footer-alerts"></div>
    </div>
  </div>

  <!-- ───── Side detail panel (mounted on row click) ───── -->
  <div id="lens-pos-detail-mount"></div>
</div>
