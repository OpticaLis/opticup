<!--
  Optic Up — Settings + Permissions (consolidated)
  Tabbed page: כללי (settings) + הרשאות (permissions).
  History: SETTINGS_PERMISSIONS_CONSOLIDATION SPEC, 2026-05-12.
  Permissions UI relocated from former employees.html (now archived).
-->
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Optic Up — הגדרות</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- Shared CSS -->
<link rel="stylesheet" href="shared/css/variables.css">
<link rel="stylesheet" href="shared/css/components.css">
<link rel="stylesheet" href="shared/css/components-extra.css">
<link rel="stylesheet" href="shared/css/layout.css">
<link rel="stylesheet" href="shared/css/forms.css">
<link rel="stylesheet" href="shared/css/modal.css">
<link rel="stylesheet" href="shared/css/toast.css">
<link rel="stylesheet" href="shared/css/table.css">

<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/employees.css">

<!-- Hybrid+Navy migration (page-scoped override, MIGRATION_2 2026-05-11) -->
<style>
  body{--primary:#1e3a8a;--primary-dark:#0f172a;--primary-light:#e6f1fb;--accent:#1e40af}
</style>
</head>
<body>

<nav id="mainNav">
  <button data-tab="general" data-tab-permission="settings.view" class="active" onclick="goSettingsTab('general')">&#9881;&#65039; כללי</button>
  <button data-tab="permissions" data-tab-permission="employees.view" onclick="goSettingsTab('permissions')">&#128272; הרשאות</button>
</nav>

<main>

<!-- ========== TAB 1: GENERAL (settings) ========== -->
<section id="tab-general" class="tab active">
  <div class="settings-container" id="settings-container">
    <h1 class="settings-title">&#9881;&#65039; הגדרות</h1>

    <!-- Section 1: Business -->
    <div class="settings-section">
      <h2 class="settings-section-title">&#127978; הגדרות עסק</h2>
      <div class="settings-grid">
        <div class="settings-field">
          <label for="set-business-name">שם העסק <span class="required">*</span></label>
          <input type="text" id="set-business-name" required>
        </div>
        <div class="settings-field">
          <label for="set-business-id">מספר עוסק מורשה / ח.פ.</label>
          <input type="text" id="set-business-id">
        </div>
        <div class="settings-field">
          <label for="set-business-phone">טלפון</label>
          <input type="tel" id="set-business-phone">
        </div>
        <div class="settings-field">
          <label for="set-business-email">אימייל</label>
          <input type="email" id="set-business-email">
        </div>
        <div class="settings-field full-width">
          <label for="set-business-address">כתובת</label>
          <textarea id="set-business-address" rows="2"></textarea>
        </div>
        <div class="settings-field full-width">
          <label>לוגו</label>
          <div class="logo-upload-area">
            <div id="logo-preview-wrap" style="text-align:center;margin-bottom:8px">
              <!-- filled by renderLogoPreview -->
            </div>
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
              <label class="btn btn-p btn-sm" for="logo-file-input" style="cursor:pointer">📷 העלה לוגו</label>
              <input type="file" id="logo-file-input" accept="image/jpeg,image/png" hidden>
              <button class="btn btn-d btn-sm" id="logo-delete" style="display:none" onclick="handleLogoDelete()">🗑️ מחק לוגו</button>
            </div>
            <small style="color:var(--g400);font-size:.78rem">JPG, PNG — עד 2MB</small>
          </div>
          <input type="hidden" id="set-logo-url">
        </div>
      </div>
    </div>

    <!-- Section 2: Financial -->
    <div class="settings-section">
      <h2 class="settings-section-title">&#128176; הגדרות פיננסיות</h2>
      <div class="settings-grid">
        <div class="settings-field">
          <label for="set-vat-rate">אחוז מע"מ</label>
          <input type="number" id="set-vat-rate" min="0" max="50" step="0.1">
        </div>
        <div class="settings-field">
          <label for="set-withholding-tax">ניכוי מס במקור (%)</label>
          <input type="number" id="set-withholding-tax" min="0" max="50" step="0.1">
        </div>
        <div class="settings-field">
          <label for="set-payment-terms">תנאי תשלום (שוטף + X ימים)</label>
          <input type="number" id="set-payment-terms" min="0" max="365">
        </div>
        <div class="settings-field">
          <label for="set-currency">מטבע ברירת מחדל</label>
          <select id="set-currency">
            <option value="ILS">&#8362; (שקל)</option>
            <option value="USD">$ (דולר)</option>
            <option value="EUR">&euro; (אירו)</option>
            <option value="GBP">&pound; (לירה)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Section 3: Display -->
    <div class="settings-section">
      <h2 class="settings-section-title">&#128421;&#65039; הגדרות תצוגה</h2>
      <div class="settings-grid">
        <div class="settings-field">
          <label for="set-rows-per-page">שורות לעמוד בטבלאות</label>
          <select id="set-rows-per-page">
            <option value="25">25</option>
            <option value="50">50</option>
            <option value="100">100</option>
            <option value="200">200</option>
          </select>
        </div>
        <div class="settings-field">
          <label for="set-date-format">פורמט תאריך</label>
          <select id="set-date-format">
            <option value="DD/MM/YYYY">DD/MM/YYYY</option>
            <option value="MM/DD/YYYY">MM/DD/YYYY</option>
            <option value="YYYY-MM-DD">YYYY-MM-DD</option>
          </select>
        </div>
        <div class="settings-field">
          <label for="set-theme">מצב תצוגה</label>
          <select id="set-theme" disabled>
            <option value="light">בהיר</option>
            <option value="dark">כהה (בקרוב)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Section 4: AI Learning -->
    <div class="settings-section">
      <h2 class="settings-section-title">&#129302; למידת AI</h2>
      <div class="settings-grid">
        <div class="settings-field">
          <label for="set-ai-suggest-after">סריקות עד הצעה</label>
          <input type="number" id="set-ai-suggest-after" min="1" max="20" value="3">
          <small style="color:var(--g400);font-size:.78rem">אחרי כמה סריקות מאותו ספק ה-AI יתחיל להציע מילוי</small>
        </div>
        <div class="settings-field">
          <label for="set-ai-auto-after">סריקות עד אוטומטי</label>
          <input type="number" id="set-ai-auto-after" min="3" max="50" value="7">
          <small style="color:var(--g400);font-size:.78rem">אחרי כמה סריקות (עם דיוק גבוה) ה-AI ימלא אוטומטית</small>
        </div>
        <div class="settings-field">
          <label for="set-ai-min-accuracy">סף דיוק מינימלי (%)</label>
          <input type="number" id="set-ai-min-accuracy" min="50" max="100" step="1" value="85">
          <small style="color:var(--g400);font-size:.78rem">ה-AI צריך להגיע לדיוק הזה לפני מעבר למצב אוטומטי</small>
        </div>
      </div>
    </div>

    <div class="settings-actions">
      <button class="btn-p" id="save-settings" onclick="saveSettings()">&#128190; שמור הגדרות</button>
    </div>
  </div>
</section>

<!-- ========== TAB 2: PERMISSIONS (employees) ========== -->
<section id="tab-permissions" class="tab">
  <div style="padding:16px">
    <div id="employees-container">טוען...</div>
  </div>
</section>

</main>

<!-- Toast container -->
<div id="toast-c"></div>

<div id="loading" class="loading-overlay" style="display:none">
  <div class="loading-box"><div class="spinner"></div><p id="loading-text">טוען...</p></div>
</div>

<!-- Confirm dialog modal -->
<div id="confirm-modal" class="modal-overlay" style="display:none">
  <div class="modal" style="max-width:400px;text-align:center">
    <h3 id="confirm-title">אישור</h3>
    <p id="confirm-text"></p>
    <button class="btn btn-s" id="confirm-yes">כן</button>
    <button class="btn btn-g" id="confirm-no">לא — חזור</button>
  </div>
</div>

<script src="shared/js/table-builder.js"></script>

<script src="shared/js/activity-logger.js"></script>
<script src="shared/js/table-resize.js"></script>
<!-- Core JS -->
<script src="js/shared-field-map.js"></script>
<script src="js/shared.js"></script>
<script src="shared/js/plan-helpers.js"></script>
<script src="js/shared-ui.js"></script>
<script src="js/auth-service.js"></script>

<script>
// =========================================================
// Tab routing — hash-based, lazy permissions init.
// SETTINGS_PERMISSIONS_CONSOLIDATION SPEC §3 criterion 10.
// Reuses showTab() from shared-ui.js (Iron Rule 21 — no duplicate).
// =========================================================
let _permissionsTabLoaded = false;

function goSettingsTab(name) {
  // Permission gate — silently no-op if user lacks the tab's permission.
  if (name === 'general'     && !hasPermission('settings.view'))  return;
  if (name === 'permissions' && !hasPermission('employees.view')) return;

  // Update URL hash without scroll-jump or history pollution.
  const desired = '#' + name;
  if (window.location.hash !== desired) {
    history.replaceState(null, '', desired);
  }

  // Switch the visible tab via the project-wide showTab() helper.
  showTab(name);

  // Lazy-init the permissions UI on first activation only.
  if (name === 'permissions' && !_permissionsTabLoaded
      && typeof loadEmployeesTab === 'function') {
    _permissionsTabLoaded = true;
    loadEmployeesTab();
  }
}

window.addEventListener('hashchange', function () {
  const h = window.location.hash;
  const name = (h === '#permissions') ? 'permissions' : 'general';
  goSettingsTab(name);
});

window.addEventListener('DOMContentLoaded', async () => {
  const session = await loadSession();
  if (!session) { window.location.href = '/'; return; }
  // Page entry: allow if EITHER permission held (per Brief §2.permission-gates).
  if (!hasPermission('settings.view') && !hasPermission('employees.view')) {
    window.location.href = '/';
    return;
  }

  // General tab is always loaded (fast — single tenants row read).
  if (hasPermission('settings.view')) {
    await loadSettings();
  }

  // Initial tab from URL hash, gated by permission.
  const initialHash = window.location.hash;
  if (initialHash === '#permissions' && hasPermission('employees.view')) {
    goSettingsTab('permissions');
  } else if (hasPermission('settings.view')) {
    goSettingsTab('general');
  } else {
    // settings.view absent but employees.view present — open permissions.
    goSettingsTab('permissions');
  }
});
</script>
</body>
</html>
